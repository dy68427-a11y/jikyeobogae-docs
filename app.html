<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지켜보개 앱 받기</title>
<meta name="description" content="반려견 미용 예약 앱 지켜보개. 안드로이드와 아이폰에서 받을 수 있습니다.">
<meta property="og:title" content="지켜보개 앱 받기">
<meta property="og:description" content="반려견 미용 예약, 라이브로 지켜보기">
<meta property="og:image" content="https://dy68427-a11y.github.io/jikyeobogae-docs/icon.png">
<link rel="icon" href="icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --cream: #FFF3E6; --orange: #F5500A; --brown: #2B1A10; }
  body { font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; background: var(--cream); color: var(--brown); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  main { width: 100%; max-width: 360px; text-align: center; }
  img { width: 104px; height: 104px; border-radius: 26px; box-shadow: 0 8px 24px rgba(245,80,10,.2); }
  h1 { font-size: 28px; margin: 20px 0 6px; letter-spacing: -0.5px; }
  p.sub { font-size: 15px; opacity: .7; margin-bottom: 28px; }
  a.btn { display: block; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 700; text-decoration: none; margin-bottom: 12px; }
  a.primary { background: var(--orange); color: #fff; }
  a.line { background: #fff; color: var(--brown); border: 1px solid rgba(43,26,16,.15); }
  p.note { font-size: 13px; opacity: .6; margin-top: 16px; min-height: 20px; }
  footer { margin-top: 28px; font-size: 12px; opacity: .55; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="지켜보개 앱 아이콘">
  <h1>지켜보개</h1>
  <p class="sub">반려견 미용 예약, 라이브로 지켜보기</p>
  <a class="btn primary" id="android" href="https://play.google.com/store/apps/details?id=com.jikyeobogae.app">안드로이드에서 받기</a>
  <a class="btn line" id="ios" href="https://apps.apple.com/kr/app/id6799382952">아이폰에서 받기</a>
  <p class="note" id="note"></p>
  <footer><a href="./">지켜보개 소개</a> · <a href="terms-of-service.html">이용약관</a> · <a href="privacy-policy.html">개인정보처리방침</a></footer>
</main>
<script>
  // Why: 프로필·DM에 주소 하나만 걸어도 폰 종류에 맞는 스토어로 가게 하려고 기기를 구분한다.
  // 아이패드는 맥으로 위장하므로 터치 지원 여부까지 본다.
  function detectStore() {
    var ua = navigator.userAgent || '';
    if (/android/i.test(ua)) return 'android';
    if (/iphone|ipad|ipod/i.test(ua)) return 'ios';
    if (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1) return 'ios';
    return null;
  }

  // Why: 자동 이동이 막히는 앱 내 브라우저에서도 버튼은 남아 있어야 하므로,
  // 화면을 지우지 않고 맞는 버튼만 강조한 뒤 이동을 시도한다.
  function goToStore() {
    var store = detectStore();
    if (!store) return;
    var target = document.getElementById(store);
    var other = document.getElementById(store === 'android' ? 'ios' : 'android');
    target.className = 'btn primary';
    other.className = 'btn line';
    document.getElementById('note').textContent = '스토어로 이동합니다. 넘어가지 않으면 버튼을 눌러주세요.';
    location.replace(target.href);
  }

  goToStore();
</script>
</body>
</html>
